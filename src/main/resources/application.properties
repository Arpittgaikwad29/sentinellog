spring.application.name=SentinelLog

server.port=8080

# Increase WebSocket message size limits for large log payloads
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536

# Pretty-print JSON in development (remove in production)
spring.jackson.serialization.indent-output=false

# Disable banner so the ASCII art in main() is the only banner
spring.main.banner-mode=off

logging.level.com.sentinellog=INFO
logging.level.org.springframework.web.socket=WARN
